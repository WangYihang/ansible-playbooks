---
- name: Install proxychains-ng
  apt:
    name: proxychains-ng
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure proxychains
  template:
    src: proxychains4.conf.j2
    dest: /etc/proxychains4.conf
    owner: root
    group: root
    mode: '0644'
  when: proxychains_proxies | length > 0
