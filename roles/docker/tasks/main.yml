---
- name: Create directory for apt keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Install python3-debian (required by deb822_repository)
  apt:
    name: python3-debian
    state: present

- name: Remove legacy Docker .list repo (migrated to deb822 .sources)
  file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker repository
  deb822_repository:
    name: docker
    types: [deb]
    uris: ["https://download.docker.com/linux/ubuntu"]
    suites: ["{{ docker_apt_codename }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc

# Force a refresh here (no cache_valid_time): the repo was just added, but an
# earlier play may have refreshed the cache <1h ago, which would otherwise make
# the install task skip its update and miss docker-ce.
- name: Update apt cache after adding Docker repo
  apt:
    update_cache: true

- name: Install Docker Engine and plugins
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove AppArmor in LXC containers to fix permissions
  apt:
    name:
      - apparmor
      - apparmor-utils
    state: absent
  when: ansible_facts['virtualization_type'] == 'lxc'
  notify: Restart Docker

- name: Ensure Docker service is running
  systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

- name: Add user to docker group (Allow docker without sudo)
  user:
    name: "{{ target_user }}"
    groups: docker
    append: true
  when: docker_add_user_to_group | bool
